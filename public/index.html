<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TreeBot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌲</text></svg>">
</head>
<body>
  <header>
    <h1>🌲 TreeBot</h1>
    <button id="user-badge" class="hidden" title="Tap to change name"></button>
  </header>

  <main id="view"></main>

  <nav id="tabs">
    <button data-tab="dashboard" class="active">📊<span>Home</span></button>
    <button data-tab="drop">📦<span>Drop</span></button>
    <button data-tab="stock">🌱<span>Stock</span></button>
    <button data-tab="allocations">🎯<span>Alloc</span></button>
    <button data-tab="keys">🔑<span>Keys</span></button>
    <button data-tab="sections">📍<span>Sections</span></button>
    <button data-tab="activity">📜<span>Activity</span></button>
    <button data-tab="sheets">📈<span>Sheets</span></button>
  </nav>

  <div id="toast" class="hidden"></div>
  <div id="modal" class="hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
